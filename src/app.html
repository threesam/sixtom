<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="theme-color" content="#161616" />
		<meta name="author" content="Salvatore D'Angelo" />
		<meta name="format-detection" content="telephone=no" />

		<title>SIXTOM — the demo works. production doesn't.</title>
		<meta
			name="description"
			content="the production sprint: live in production on day 10 — and you own every line of it. $10,000 flat, 1 client a month."
		/>
		<!-- Canonical URL is set dynamically per-route in src/routes/+layout.svelte
		     using $app/state's page.url.pathname; do not hardcode here to avoid
		     duplicate canonical tags on non-home routes. -->

		<!-- Search-engine ownership: verify via DNS TXT record on the domain
		     (Search Console "Domain property" / Bing import) — covers every
		     subdomain with zero markup. No placeholder meta tags in prod. -->

		<link rel="preconnect" href="https://analytics.sixtom.com" />
		<link
			rel="preload"
			href="%sveltekit.assets%/fonts/recursive.woff2"
			as="font"
			type="font/woff2"
			crossorigin
		/>
		<link
			rel="preload"
			href="%sveltekit.assets%/fonts/cabinet-grotesk.woff2"
			as="font"
			type="font/woff2"
			crossorigin
		/>

		<meta property="og:title" content="SIXTOM — the demo works. production doesn't." />
		<meta
			property="og:description"
			content="live in production on day 10 — and you own every line of it. $10,000 flat, 1 client a month."
		/>
		<meta property="og:type" content="website" />
		<!-- og:url lives in +layout.svelte (per-route, alongside canonical) — a
		     static one here would duplicate it and scrapers take the first. -->
		<meta property="og:image" content="https://sixtom.com/og.png" />
		<meta property="og:image:width" content="1200" />
		<meta property="og:image:height" content="630" />
		<meta property="og:image:alt" content="SIXTOM — the demo works. production doesn't." />

		<meta name="twitter:card" content="summary_large_image" />
		<meta name="twitter:title" content="SIXTOM — the demo works. production doesn't." />
		<meta
			name="twitter:description"
			content="live in production on day 10 — and you own every line of it. $10,000 flat, 1 client a month."
		/>
		<meta name="twitter:image" content="https://sixtom.com/og.png" />
		<meta name="twitter:image:alt" content="SIXTOM — the demo works. production doesn't." />

		<link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
		<link rel="apple-touch-icon" sizes="180x180" href="%sveltekit.assets%/apple-touch-icon.png" />

		<script>
			// testing eject: ?test flips umami's native kill switch for this
			// browser (persistent); ?test=0 rejoins. Server-side events use the
			// test_eject cookie (hooks.server.ts) — this covers the client side.
			try {
				var q = new URLSearchParams(location.search)
				if (q.has('test')) {
					q.get('test') === '0'
						? localStorage.removeItem('umami.disabled')
						: localStorage.setItem('umami.disabled', '1')
				}
			} catch (e) {}
		</script>
		<script
			defer
			src="https://analytics.sixtom.com/script.js"
			data-website-id="64398c1a-02a0-4a61-991c-b0d143f01b46"
			data-domains="sixtom.com"
		></script>
		<!-- Hero bubble-field animation. Standalone (no framework) so the home page
		     stays csr=false; no-ops on pages without a [data-bubble] canvas. -->
		<script defer src="%sveltekit.assets%/bubbles.js"></script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
